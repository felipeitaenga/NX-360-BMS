<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0b0f19" />
        <meta name="description" content="NX-360 BMS — Sistema de automação predial (HVAC, Iluminação e Hidráulica)" />
        <meta name="application-name" content="NX-360 BMS" />
        <!-- Mobile web app -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="NX-360" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="format-detection" content="telephone=no" />
        <!-- Icons -->
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/favicon-32.png" />
        <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
        <!-- PWA manifest -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>NX-360 BMS — Automação Predial</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
    </head>
    <body>
        <noscript>Habilite o JavaScript para rodar o NX-360 BMS.</noscript>
        <div id="root"></div>
        <!-- Service Worker: registrar apenas em HTTPS (ou localhost para dev) -->
        <script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              var isSecure = window.location.protocol === 'https:' ||
                             window.location.hostname === 'localhost' ||
                             window.location.hostname === '127.0.0.1';
              if (isSecure) {
                navigator.serviceWorker.register('/sw.js').catch(function (err) {
                  console.warn('SW register failed:', err);
                });
              }
            });
          }
        </script>
    </body>
</html>
