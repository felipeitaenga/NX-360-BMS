# Reverse proxy público — roteia / para o container frontend e /api para o backend.
# Suporta WebSocket em /api/ws.
# Copie para /etc/nginx/sites-enabled/ no host (ou use um container nginx dedicado).

upstream nx360_frontend { server 127.0.0.1:8080; }
upstream nx360_backend  { server 127.0.0.1:8001; }

server {
    listen 80;
    server_name bms.suaempresa.com.br;  # TROQUE pelo seu domínio

    client_max_body_size 20M;  # Upload de plantas até 15 MB

    # WebSocket precisa de headers de upgrade
    location /api/ws {
        proxy_pass         http://nx360_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Backend REST
    location /api/ {
        proxy_pass         http://nx360_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend
    location / {
        proxy_pass         http://nx360_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
