version: "3.9"

# NX-360 BMS — stack completo (MongoDB + backend FastAPI + frontend React)
# As variáveis vêm de .env (copie de .env.example).

services:
  mongo:
    image: mongo:7
    container_name: nx360_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - nx360_mongo_data:/data/db
    networks: [nx360]
    # Mongo exposto SÓ internamente — não publique a 27017 pra fora
    ports: []
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: nx360_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      # Opcional: fuso ou prefixo MQTT padrão
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-TJS}
      # Lista de origens permitidas no CORS (separar por vírgula). Em produção, use a URL pública.
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - nx360_uploads:/app/uploads  # planta baixa / logos
    networks: [nx360]
    ports:
      - "127.0.0.1:8001:8001"       # só localhost — o nginx do host faz o proxy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    container_name: nx360_frontend
    restart: unless-stopped
    networks: [nx360]
    ports:
      - "127.0.0.1:8080:80"         # só localhost — o nginx do host faz o proxy

volumes:
  nx360_mongo_data:
  nx360_uploads:

networks:
  nx360:
    driver: bridge
