version: "3.9"

# NX-360 BMS — stack completo (MongoDB + backend FastAPI + frontend React + gateway Nginx)
# Acesso público: http://SEU_IP:${PUBLIC_PORT}/
# As variáveis vêm de .env (copie de .env.example).

services:
  mongo:
    image: mongo:7
    container_name: nx360_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - nx360_mongo_data:/data/db
    networks: [nx360]
    # Mongo exposto SÓ internamente — não publica porta pro host
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: nx360_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-TJS}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - nx360_uploads:/app/uploads
    networks: [nx360]
    # Não publica porta pro host — o gateway nginx dentro da stack cuida disso

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    container_name: nx360_frontend
    restart: unless-stopped
    networks: [nx360]

  gateway:
    image: nginx:1.27-alpine
    container_name: nx360_gateway
    restart: unless-stopped
    depends_on: [backend, frontend]
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [nx360]
    ports:
      - "${PUBLIC_PORT:-8090}:80"   # porta pública — acesso http://SEU_IP:PUBLIC_PORT/

volumes:
  nx360_mongo_data:
  nx360_uploads:

networks:
  nx360:
    driver: bridge
