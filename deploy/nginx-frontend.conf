# Nginx que serve APENAS o frontend React estático dentro do container frontend.
# O proxy do /api e /api/ws fica no reverse proxy externo (ver nginx-proxy.conf).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache agressivo para assets com hash do webpack
    location /static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — qualquer rota do React cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}
