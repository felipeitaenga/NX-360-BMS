# Gateway Nginx — expõe o NX-360 BMS numa porta única
# Acesso: http://SEU_IP:PUBLIC_PORT/

upstream nx360_frontend { server frontend:80; }
upstream nx360_backend  { server backend:8001; }

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 512M;  # Plantas + restauração de backup (até 500 MB)

    # WebSocket (tempo real)
    location /api/ws {
        proxy_pass         http://nx360_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Backend REST
    location /api/ {
        proxy_pass         http://nx360_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Frontend React (todo o resto)
    location / {
        proxy_pass         http://nx360_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
